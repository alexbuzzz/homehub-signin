<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Home Hub — connect Google Calendar</title>
<!--
  Home Hub's sign-in page (the wall tablet has no browser and Google does not allow its "enter a code" sign-in for
  calendars). Two moves, nothing stored, nothing sent anywhere but to Google itself:
  1. Opened from the tablet's QR (#c=<client id>&p=<PKCE challenge>&s=<state>) → goes on to Google's own sign-in.
  2. Google sends the phone back here with ?code=…&state=… → the page shows "HHG1 <state> <code>" as a QR for the
     tablet's camera. The code is worthless without the secret half (PKCE verifier) that never left the tablet.
  No analytics, no outside scripts: qrcode.js (MIT, Kazuhiko Arase) is the only one, served from here.
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #efeff1;
         font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; color: #1d1d1f; }
  main { width: min(92vw, 440px); background: #fff; border-radius: 24px; padding: 28px 24px; text-align: center;
         box-shadow: 0 2px 10px rgba(30, 24, 20, .08); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 8px 0; color: #3b3b40; }
  .muted { color: #6e6e75; font-size: 14px; }
  #qr { margin: 18px auto 8px; width: min(78vw, 340px); aspect-ratio: 1; background: #fff; }
  #qr svg, #qr img { width: 100%; height: 100%; display: block; }
  .bad { color: #c4302b; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="title">Home Hub</h1>
  <p id="text">One moment…</p>
  <div id="qr" hidden></div>
  <p id="hint" class="muted" hidden></p>
  <p class="muted" style="margin-top: 22px">Home Hub — a family planner. <a href="privacy.html">Privacy</a></p>
</main>
<script src="qrcode.js"></script>
<script>
(function () {
  var SCOPES = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.calendarlist.readonly';
  var here = location.origin + location.pathname;
  var q = new URLSearchParams(location.search);
  var f = new URLSearchParams(location.hash.slice(1));
  var $ = function (id) { return document.getElementById(id); };

  function say(title, text, bad) {
    $('title').textContent = title;
    $('text').textContent = text;
    $('text').className = bad ? 'bad' : '';
  }

  // 2. back from Google: the code as a QR for the tablet
  if (q.get('code') && q.get('state')) {
    var payload = 'HHG1 ' + q.get('state') + ' ' + q.get('code');
    var qr = qrcode(0, 'M');
    qr.addData(payload);
    qr.make();
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
    $('qr').hidden = false;
    say('Almost done', 'Hold this screen up to the tablet’s camera, above its screen, about a hand’s width away.');
    $('hint').textContent = 'Turn the phone’s brightness up if the tablet doesn’t see it. You can close this page afterwards.';
    $('hint').hidden = false;
    // the code is not left in the address bar or history
    history.replaceState(null, '', here);
    return;
  }
  if (q.get('error')) {
    say('Not connected', q.get('error') === 'access_denied' ? 'Access wasn’t allowed. Start again on the tablet if you want to connect.' : 'Google said: ' + q.get('error'), true);
    return;
  }
  // 1. from the tablet's QR: on to Google's sign-in
  if (f.get('c') && f.get('p') && f.get('s')) {
    var url = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
      client_id: f.get('c'),
      redirect_uri: here,
      response_type: 'code',
      scope: SCOPES,
      access_type: 'offline',
      prompt: 'consent',
      code_challenge: f.get('p'),
      code_challenge_method: 'S256',
      state: f.get('s')
    }).toString();
    say('Home Hub', 'Opening Google…');
    location.replace(url);
    return;
  }
  say('Home Hub', 'Open this page by scanning the QR code on the Home Hub tablet (Settings → Family → a person → Google Calendar).');
})();
</script>
</body>
</html>
